vaultwarden_admin_token: "{{ vaultwarden_admin_token_hash }}"

vaultwarden_email_smtp_user: "shajal525@gmail.com"
vaultwarden_email_smtp_password: "{{ pvehomelab_gmail_smtp_password }}"
vaultwarden_email_from: "vaultwarden@{{ subdomain }}"

vaultwarden_backup_db: true
vaultwarden_restore_db: false
