vaultwarden_base_path: "{{ base_app_storage_path }}/vaultwarden"
vaultwarden_data_dir: "{{ vaultwarden_base_path }}/data"

vaultwarden_local_dir: "{{ base_local_ssd_storage_path }}/vaultwarden"
vaultwarden_postgres_data_dir: "{{ vaultwarden_local_dir }}/vaultwardendb"
vaultwarden_backup_scripts: "{{ vaultwarden_local_dir }}/db_backup_scripts"

vaultwarden_db_name: "vaultwarden_db"
