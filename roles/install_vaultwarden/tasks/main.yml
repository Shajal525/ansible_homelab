---
# - name: Ensure Docker service is running and setup user access
#   include_role:
#     name: common
#     tasks_from: setup_docker_user
#   vars:
#     target_user: "{{ docker_user }}"

- name: Ensure docker networks exist
  community.docker.docker_network:
    name: "{{ network_item }}"
    state: present
  loop:
    - traefik_proxy
    - pangolin_network
  loop_control:
    loop_var: network_item

- name: Get user information
  getent:
    database: passwd
    key: "{{ docker_user }}"

- name: Set UID and GID facts
  set_fact:
    target_uid: "{{ getent_passwd[docker_user][1] }}"
    target_gid: "{{ getent_passwd[docker_user][2] }}"

- name: Create external network
  community.docker.docker_network:
    name: vaultwarden_network
    driver: bridge
    state: present

- name: Create Vaultwarden directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ target_uid }}"
    group: "{{ target_gid }}"
    recurse: true
    mode: "0755"
  loop:
    - "{{ vaultwarden_data_dir }}"
    - "{{ vaultwarden_backup_scripts }}"
    - "{{ vaultwarden_postgres_data_dir }}"

# traefik_proxy is needed so the cron_runner container can reach the DB for backups
- name: Deploy Vaultwarden Postgres DB container
  community.docker.docker_container:
    name: postgres_vaultwarden
    image: postgres:18.1
    hostname: postgres_vaultwarden
    user: "{{ target_uid }}:{{ target_gid }}"
    env:
      POSTGRES_DB: "{{ vaultwarden_db_name }}"
      POSTGRES_USER: "{{ vaultwarden_db_user }}"
      POSTGRES_PASSWORD: "{{ vaultwarden_db_password }}"
    volumes:
      - "{{ vaultwarden_postgres_data_dir }}:/var/lib/postgresql"
    labels:
      com.docker.compose.project: "vaultwarden_stack"
      com.docker.compose.service: "postgres_vaultwarden"
    networks:
      - name: traefik_proxy
      - name: vaultwarden_network
    restart_policy: unless-stopped
    state: started

# Don't add the authentik@file middleware here. Forward auth breaks the Bitwarden
# mobile/desktop/browser clients.
# Settings saved in the /admin panel go to /data/config.json and override the env below.
# Change settings here instead, or use "Reset defaults" in /admin to remove config.json.
- name: Deploy Vaultwarden container
  community.docker.docker_container:
    name: vaultwarden
    image: vaultwarden/server:1.37.4
    hostname: vaultwarden
    user: "{{ target_uid }}:{{ target_gid }}"
    security_opts:
      - "no-new-privileges:true"
    env:
      DOMAIN: "{{ vaultwarden_url }}"
      ROCKET_PORT: "8080" # non-root user can't bind to port 80
      DATABASE_URL: "postgresql://{{ vaultwarden_db_user }}:{{ vaultwarden_db_password | urlencode | replace('/', '%2F') }}@postgres_vaultwarden:5432/{{ vaultwarden_db_name }}"
      ADMIN_TOKEN: "{{ vaultwarden_admin_token }}"
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "true"
      # Email
      SMTP_HOST: "smtp.gmail.com"
      SMTP_PORT: "465"
      SMTP_SECURITY: "force_tls"
      SMTP_USERNAME: "{{ vaultwarden_email_smtp_user }}"
      SMTP_PASSWORD: "{{ vaultwarden_email_smtp_password }}"
      SMTP_FROM: "{{ vaultwarden_email_from }}"
    volumes:
      - "{{ vaultwarden_data_dir }}:/data"
      - "/etc/localtime:/etc/localtime:ro"
    labels:
      com.docker.compose.project: "vaultwarden_stack"
      com.docker.compose.service: "vaultwarden"
      traefik.enable: "true"
      traefik.http.routers.vaultwarden-secure.entrypoints: "https"
      traefik.http.routers.vaultwarden-secure.rule: "Host(`{{ vaultwarden_domain }}`)"
      traefik.http.routers.vaultwarden-secure.tls: "true"
      traefik.http.routers.vaultwarden-secure.service: "vaultwarden"
      traefik.http.services.vaultwarden.loadbalancer.server.port: "8080"
      traefik.docker.network: "traefik_proxy"
    networks:
      - name: traefik_proxy
      - name: vaultwarden_network
      - name: pangolin_network
    restart_policy: unless-stopped
    state: started

- name: Include common backup task to backup postgres db
  include_role:
    name: common
    tasks_from: db_backup_image
  vars:
    db_backup_app_name: "vaultwarden"
    container_name_running_postgresdb: "postgres_vaultwarden"
    db_backup_retain_for_days: "7"
    db_to_backup_name: "{{ vaultwarden_db_name }}"
    db_to_backup_user: "{{ vaultwarden_db_user }}"
    db_to_backup_password: "{{ vaultwarden_db_password }}"
    backup_schedule_cron: "30 2 * * *"
    notification_message_subject: "Vaultwarden DB backup"
  when: vaultwarden_backup_db | default(false)
  tags: vaultwarden

- name: Wait for 10 seconds for DB backup to finish
  pause:
    seconds: 10
  when: vaultwarden_backup_db | default(false) and vaultwarden_restore_db | default(false)
  tags: vaultwarden

- name: Restore PostgreSQL database from backup
  include_role:
    name: common
    tasks_from: postgresdb_restore
  vars:
    postgres_restore_base_path: "{{ vaultwarden_backup_scripts }}"
    pg_backup_directory: "{{ vaultwarden_base_path }}/db_backups/"
    pg_database: "{{ vaultwarden_db_name }}"
    pg_host: "postgres_vaultwarden"
    pg_port: 5432
    pg_user: "{{ vaultwarden_db_user }}"
    pg_password: "{{ vaultwarden_db_password }}"
    pg_drop_before_restore: true
  when: vaultwarden_restore_db | default(false)
  tags: vaultwarden

# Without comparisons: ignore, the module compares the container against the image defaults
# (e.g. ROCKET_PORT=80) and recreates it bare, without volumes/env/labels/networks.
- name: Restart containers
  community.docker.docker_container:
    name: "{{ item }}"
    state: started
    restart: true
    comparisons:
      "*": ignore
  loop:
    - postgres_vaultwarden
    - vaultwarden
  when: vaultwarden_restore_db | default(false)
  tags: vaultwarden

- name: Vaultwarden deployed
  debug:
    msg: "Vaultwarden is running successfully. To check if it's working, open: {{ vaultwarden_url }} in your browser. Admin panel: {{ vaultwarden_url }}/admin"
  tags: vaultwarden
